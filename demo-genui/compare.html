<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nido · roto vs. arreglado</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      body { margin: 0; background: #0b1220; color: #e2e8f0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
      header h1 { margin: 0; font: 700 15px ui-monospace, Menlo, monospace; color: #a7f3d0; }
      header select, header button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #334155; background: #111a2e; color: #e2e8f0; }
      header button { background: #14b8a6; color: #04201d; font-weight: 700; border-color: #14b8a6; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; min-height: 0; }
      .col { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
      .col.bad { border-color: #f87171; } .col.good { border-color: #34d399; }
      .lbl { padding: 6px 10px; font: 700 13px ui-monospace, Menlo, monospace; display: flex; justify-content: space-between; gap: 10px; }
      .bad .lbl { background: #3b1111; color: #fecaca; } .good .lbl { background: #0f2a2a; color: #a7f3d0; }
      .lbl b { font-size: 15px; color: #fff; }
      iframe { width: 100%; height: 100%; border: 0; background: #faf7f2; }
    </style>
  </head>
  <body>
    <header>
      <h1>Nido · misma IA, mismo stream</h1>
      <select id="regla" aria-label="Regla">
        <option value="1">Regla 1 · Reserva el espacio</option>
        <option value="2">Regla 2 · Lee cada parte una vez</option>
        <option value="3">Regla 3 · Reutiliza, no rehagas</option>
        <option value="4">Regla 4 · Un solo lugar para los datos</option>
      </select>
      <button id="go" type="button">▶ Generar en los dos</button>
    </header>
    <div class="cols">
      <div class="col bad"><div class="lbl"><span data-l="bad"></span><span data-m="bad"></span></div><iframe title="Regla apagada" data-f="bad"></iframe></div>
      <div class="col good"><div class="lbl"><span data-l="good"></span><span data-m="good"></span></div><iframe title="Regla prendida" data-f="good"></iframe></div>
    </div>
    <script type="module" src="/src/compare.ts"></script>
  </body>
</html>
